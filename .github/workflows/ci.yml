name: CI

# L1 module CI (2026-10-31): before this file the only workflow was
# semantic-release on main, so every PR (including the sshd-limits change
# that retires the L2 drop-in) merged with zero automated checks.
#
# Terraform steps are inline, NOT the org reusable: this repository is public
# and DarojaAI/infra-actions is private, and GitHub refuses to load a workflow
# that calls a reusable workflow from a private repository — the run never
# starts, zero jobs, conclusion "failure" (observed on main, run 41222838327).
# Restore the reusable (and its checkov scan) when infra-actions is public or
# a public mirror exists; until then fmt+validate inline plus the default
# CodeQL "Analyze (actions)" is what actually runs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          set -euo pipefail
          # No backend block in this repo: state lives with the consumer
          # (linux-desktop-seed passes its own per environment).
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

  provisioning-shell:
    name: Provisioning scripts (shellcheck + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck and bats
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats

      - name: shellcheck (provisioning scripts)
        run: |
          set -euo pipefail
          shellcheck -x scripts/*.sh

      - name: bats (provisioning suites)
        run: |
          set -euo pipefail
          # Hermetic by design: every suite renders into a temp dir and stubs
          # sshd/systemctl on PATH — nothing here touches a real host.
          bats --print-output-on-failure tests/
