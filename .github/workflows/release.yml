name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    uses: DarojaAI/public-workflows/.github/workflows/reusable-semantic-release.yml@832bde0db33f72c57fe9044fa53c5ac8e0a39794  # v2.2.0
    with:
      skip-dirty-check: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
